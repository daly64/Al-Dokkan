name: Construire l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compiler l'APK
        run: |
          gradle :app:assembleDebug -PdokkanVersionCode=${{ github.run_number }} --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk al-dokkan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: al-dokkan-apk
          path: al-dokkan.apk

      - name: Publier la version
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Al Dokkan 1.0.${{ github.run_number }}
          prerelease: true
          files: al-dokkan.apk
