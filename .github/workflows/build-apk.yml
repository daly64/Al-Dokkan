name: Construire l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Clients (publics) : mobile et TV.
      - name: Compiler les APK clients
        run: |
          gradle :app:assembleClientMobileDebug :app:assembleClientTvDebug -PdokkanVersionCode=${{ github.run_number }} --no-daemon --stacktrace
          cp app/build/outputs/apk/clientMobile/debug/app-client-mobile-debug.apk al-dokkan-clients.apk
          cp app/build/outputs/apk/clientTv/debug/app-client-tv-debug.apk al-dokkan-clients-tv.apk

      # Admin (mobile seulement) : plus de clé cachée ; l'appareil admin s'enregistre avec sa propre clé.
      - name: Compiler l'APK admin
        run: |
          gradle :app:assembleAdminMobileDebug -PdokkanVersionCode=${{ github.run_number }} --no-daemon --stacktrace
          cp app/build/outputs/apk/adminMobile/debug/app-admin-mobile-debug.apk al-dokkan-admin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: al-dokkan-apk
          path: |
            al-dokkan-clients.apk
            al-dokkan-clients-tv.apk
            al-dokkan-admin.apk
          if-no-files-found: ignore

      - name: Publier les APK clients
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Al Dokkan 1.0.${{ github.run_number }}
          prerelease: true
          files: |
            al-dokkan-clients.apk
            al-dokkan-clients-tv.apk

      # Brouillon : l'APK admin reste visible seulement par toi sur GitHub.
      - name: Garder l'APK admin en brouillon privé
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-v1.0.${{ github.run_number }}
          name: Admin 1.0.${{ github.run_number }}
          draft: true
          files: al-dokkan-admin.apk
