name: Construire l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compiler les APK
        run: |
          gradle :app:assembleAdminMobileDebug :app:assembleAdminTvDebug :app:assembleClientMobileDebug :app:assembleClientTvDebug -PdokkanVersionCode=${{ github.run_number }} --no-daemon --stacktrace
          # Admin : noms inchangés (les installations actuelles continuent de se mettre à jour).
          cp app/build/outputs/apk/adminMobile/debug/app-admin-mobile-debug.apk al-dokkan.apk
          cp app/build/outputs/apk/adminTv/debug/app-admin-tv-debug.apk al-dokkan-tv.apk
          # Clients
          cp app/build/outputs/apk/clientMobile/debug/app-client-mobile-debug.apk al-dokkan-clients.apk
          cp app/build/outputs/apk/clientTv/debug/app-client-tv-debug.apk al-dokkan-clients-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: al-dokkan-apk
          path: |
            al-dokkan.apk
            al-dokkan-tv.apk
            al-dokkan-clients.apk
            al-dokkan-clients-tv.apk

      - name: Publier la version
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Al Dokkan 1.0.${{ github.run_number }}
          prerelease: true
          files: |
            al-dokkan.apk
            al-dokkan-tv.apk
            al-dokkan-clients.apk
            al-dokkan-clients-tv.apk
